name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter analyze + unit tests (no device, no paid providers)
        run: |
          flutter --version
          cd mobile
          flutter pub get
          flutter analyze
          flutter test

  baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check required docs exist
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f docs/architecture/master-plan.md
          test -f docs/milestones/roadmap.md
          test -f docs/milestones/current-status.md
          test -f docs/research/open-source-reuse-audit.md
          test -f docs/research/retailer-sources.md
          test -f docs/research/kortingklok-reuse.md
          test -f docs/data-model/domain-model.md
          test -f docs/contracts/search-api-contract.md
          test -f docs/contracts/basket-api-contract.md
          test -f docs/contracts/mcp-tools-contract.md
          test -f docs/contracts/freshness-api-contract.md
          test -f docs/contracts/assistant-api-contract.md
          test -f docs/milestones/m13-results.md
          test -f docs/research/m14-web-stack-evaluation.md
          test -f docs/adr/ADR-0007-web-frontend-stack.md
          test -f docs/milestones/m14-results.md
          test -f web/README.md

      - name: Prepare env
        run: cp .env.example .env

      - name: Pre-create snapshot directories (docker mounts would create them root-owned otherwise)
        run: |
          mkdir -p snapshots/vero
          mkdir -p snapshots/stokomak
          mkdir -p snapshots/zito
          mkdir -p snapshots/kam
          mkdir -p snapshots/matching
          mkdir -p snapshots/opensearch
          mkdir -p snapshots/scheduler

      - name: Raise vm.max_map_count for OpenSearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Start baseline stack
        run: docker compose up -d --wait

      - name: Validate baseline
        shell: pwsh
        run: ./scripts/validate-baseline.ps1

      - name: Adapter, matcher, search & scheduler unit tests (Python 3.12, stdlib only)
        run: |
          docker run --rm -v "$PWD:/w" -w /w/adapters/common python:3.12-slim python -B tests.py
          docker run --rm -v "$PWD:/w" -w /w/adapters/vero python:3.12-slim python -B tests.py
          docker run --rm -v "$PWD:/w" -w /w/adapters/stokomak python:3.12-slim python -B tests.py
          docker run --rm -v "$PWD:/w" -w /w/adapters/kam python:3.12-slim python -B tests.py
          docker run --rm -v "$PWD:/w" -w /w/matching python:3.12-slim python -B tests.py
          docker run --rm -v "$PWD:/w" -w /w/search python:3.12-slim python -B tests.py
          docker run --rm -v "$PWD:/w" -w /w/adapters/scheduler python:3.12-slim python -B tests.py

      - name: Backend FastAPI tests (Python 3.12, uv, locked deps)
        run: >
          docker run --rm -v "$PWD/backend_py:/w" -v aoshopping-uv-cache:/root/.cache/uv
          -v aoshopping-uv-venv:/w/.venv -w /w
          ghcr.io/astral-sh/uv:python3.12-bookworm-slim
          sh -c "uv sync --locked && uv run pytest -q"

      - name: M1 integration test (replay fixtures, idempotent load)
        shell: pwsh
        run: ./scripts/test-m1.ps1

      - name: M2 integration test (multi-source replay, matching, comparison)
        shell: pwsh
        run: ./scripts/test-m2.ps1

      - name: M3 integration test (OpenSearch projections, alias swap, REST API & fallback)
        shell: pwsh
        run: ./scripts/test-m3.ps1

      - name: M4 integration test (shopping lists, unit scaling, single & multi-store basket optimization)
        shell: pwsh
        run: ./scripts/test-m4.ps1

      - name: M5 integration test (bounded read-only MCP server, 7 tools, handshake & tool calls)
        shell: pwsh
        run: ./scripts/test-m5.ps1

      - name: M6 integration test (daily scheduler, freshness API, quarantine & alerting)
        shell: pwsh
        run: ./scripts/test-m6.ps1

      - name: M9 integration test (KAM PDF adapter replay through scheduler & loader)
        shell: pwsh
        run: ./scripts/test-m9.ps1

      - name: M10 differential regression (Spring Boot jar vs FastAPI on identical data)
        shell: pwsh
        run: ./scripts/test-m10-diff.ps1

      - name: Teardown
        if: always()
        run: docker compose down -v

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Web prototype tests (Python 3.12, no browser, no network)
        run: >
          docker run --rm -v "$PWD/web:/w" -w /w
          python:3.12-slim
          sh -c "pip install --quiet -r requirements.txt pytest && python -m pytest tests -q"
