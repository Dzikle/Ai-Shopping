name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required docs exist
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f docs/architecture/master-plan.md
          test -f docs/milestones/roadmap.md
          test -f docs/milestones/current-status.md
          test -f docs/research/open-source-reuse-audit.md
          test -f docs/research/retailer-sources.md
          test -f docs/data-model/domain-model.md
          test -f docs/contracts/search-api-contract.md

      - name: Prepare env
        run: cp .env.example .env

      - name: Raise vm.max_map_count for OpenSearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Start baseline stack
        run: docker compose up -d --wait

      - name: Validate baseline
        shell: pwsh
        run: ./scripts/validate-baseline.ps1

      - name: Adapter, matcher & search unit tests (Python 3.12, stdlib only)
        run: |
          docker run --rm -v "$PWD:/w" -w /w/adapters/common python:3.12-slim python -B tests.py
          docker run --rm -v "$PWD:/w" -w /w/adapters/vero python:3.12-slim python -B tests.py
          docker run --rm -v "$PWD:/w" -w /w/adapters/stokomak python:3.12-slim python -B tests.py
          docker run --rm -v "$PWD:/w" -w /w/matching python:3.12-slim python -B tests.py
          docker run --rm -v "$PWD:/w" -w /w/search python:3.12-slim python -B tests.py

      - name: Backend JUnit tests (Java 21 / Spring Boot)
        run: |
          docker run --rm -v "$PWD/backend:/w" -w /w maven:3.9.9-eclipse-temurin-21 mvn -B test

      - name: M1 integration test (replay fixtures, idempotent load)
        shell: pwsh
        run: ./scripts/test-m1.ps1

      - name: M2 integration test (multi-source replay, matching, comparison)
        shell: pwsh
        run: ./scripts/test-m2.ps1

      - name: M3 integration test (OpenSearch projections, alias swap, REST API & fallback)
        shell: pwsh
        run: ./scripts/test-m3.ps1

      - name: Teardown
        if: always()
        run: docker compose down -v
