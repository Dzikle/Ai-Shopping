[project]
name = "ai-shopping-backend"
version = "0.4.0"
description = "AI Shopping FastAPI backend (search, baskets, review, freshness, metrics, MCP)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.8",
    "psycopg[binary,pool]>=3.2",
    "opensearch-py>=2.8,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
python-downloads = "automatic"
