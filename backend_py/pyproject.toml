[project]
name = "ai-shopping-backend-py"
version = "0.3.0"
description = "FastAPI port of the ai-shopping backend (M1-M9)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "psycopg[binary,pool]>=3.1",
    "opensearch-py<4",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
python-downloads = "automatic"
